<div class="tools-container" [dir]="i18nService.currentDirection">
  <div class="tools-header">
    <h1>{{ 'Tools' | translate }}</h1>
    <p>{{ 'tools_description' | translate }}</p>
  </div>

  <div class="tools-content">
    <aside class="tools-sidebar">
      <nav class="tools-menu">
        <ul>
          <li>
            <a 
              (click)="selectTool('text-tools')" 
              [class.active]="selectedTool === 'text-tools'"
              class="tool-link">
              {{ 'Text_Tools' | translate }}
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('json-formatter')" 
              [class.active]="selectedTool === 'json-formatter'"
              class="tool-link">
              {{ 'JSON_Formatter' | translate }}
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('xml-formatter')" 
              [class.active]="selectedTool === 'xml-formatter'"
              class="tool-link">
              {{ 'XML_Formatter' | translate }}
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('word-to-pdf')" 
              [class.active]="selectedTool === 'word-to-pdf'"
              class="tool-link">
              {{ 'Word_to_PDF' | translate }}
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('pdf-to-word')" 
              [class.active]="selectedTool === 'pdf-to-word'"
              class="tool-link">
              PDF to Word
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('image-converter')" 
              [class.active]="selectedTool === 'image-converter'"
              class="tool-link">
              {{ 'Image_Converter' | translate }}
            </a>
          </li>
          <li>
            <a 
              (click)="selectTool('guid-generator')" 
              [class.active]="selectedTool === 'guid-generator'"
              class="tool-link">
              GUID Converter
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="tools-main">
      <!-- Text Tools -->
      <app-text-tools *ngIf="selectedTool === 'text-tools'"></app-text-tools>

      <!-- JSON Formatter -->
      <app-json-formatter *ngIf="selectedTool === 'json-formatter'"></app-json-formatter>

      <!-- XML Formatter -->
      <app-xml-formatter *ngIf="selectedTool === 'xml-formatter'"></app-xml-formatter>

      <!-- Word to PDF -->
      <app-document-converter 
        *ngIf="selectedTool === 'word-to-pdf'" 
        mode="word-to-pdf">
      </app-document-converter>

      <!-- PDF to Word -->
      <app-document-converter 
        *ngIf="selectedTool === 'pdf-to-word'" 
        mode="pdf-to-word">
      </app-document-converter>

      <!-- Image Converter -->
      <app-image-converter *ngIf="selectedTool === 'image-converter'"></app-image-converter>

      <!-- GUID Converter -->
      <app-guid-converter *ngIf="selectedTool === 'guid-generator'"></app-guid-converter>
    </main>
  </div>
</div>
