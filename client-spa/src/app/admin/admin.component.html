<div class="admin-container" [dir]="i18nService.currentDirection">
  <div class="admin-header">
    <div class="header-content">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Manage your website content and settings</p>
      </div>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </div>

  <div class="admin-content">
    <aside class="admin-sidebar">
      <nav class="admin-menu">
        <ul>
          <li>
            <a routerLink="/admin/dashboard" routerLinkActive="active">
              Dashboard
            </a>
          </li>
          <li>
            <a routerLink="/admin/users" routerLinkActive="active">
              Users
            </a>
          </li>
          <li>
            <a routerLink="/admin/posts" routerLinkActive="active">
              Posts
            </a>
          </li>
          <li>
            <a routerLink="/admin/projects" routerLinkActive="active">
              Projects
            </a>
          </li>
          <li>
            <a routerLink="/admin/settings" routerLinkActive="active">
              Settings
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
