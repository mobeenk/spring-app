<div class="users-container">
  <div class="users-header">
    <h2>User Management</h2>
    <button class="btn-add" (click)="openAddModal()">+ Add New User</button>
  </div>

  <div class="search-bar">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      (input)="filterUsers()"
      placeholder="Search by username or email..."
    />
  </div>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="loading" *ngIf="isLoading">
    Loading users...
  </div>

  <div class="users-table" *ngIf="!isLoading">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="role-badge" [ngClass]="user.roles">
              {{ user.roles }}
            </span>
          </td>
          <td>
            <span class="status-badge" [ngClass]="user.accountNonLocked ? 'unlocked' : 'locked'">
              {{ user.accountNonLocked ? 'Unlocked' : 'Locked' }}
            </span>
          </td>
          <td class="actions">
            <button class="btn-edit" (click)="openEditModal(user)" title="Edit">✏️</button>
            <button 
              class="btn-lock" 
              *ngIf="user.accountNonLocked"
              (click)="lockUser(user.name)"
              title="Lock User">
              🔒
            </button>
            <button 
              class="btn-unlock" 
              *ngIf="!user.accountNonLocked"
              (click)="unlockUser(user.name)"
              title="Unlock User">
              🔓
            </button>
            <button class="btn-delete" (click)="deleteUser(user.name)" title="Delete">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="no-users" *ngIf="filteredUsers.length === 0">
      No users found
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal" *ngIf="showAddModal">
  <div class="modal-overlay" (click)="closeAddModal()"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New User</h3>
      <button class="btn-close" (click)="closeAddModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="newUser.name" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="newUser.email" placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="newUser.password" placeholder="Enter password" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="newUser.roles">
          <option value="ROLE_USER">User</option>
          <option value="ROLE_SUPERVISOR">Supervisor</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeAddModal()">Cancel</button>
      <button class="btn-save" (click)="addUser()">Add User</button>
    </div>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal" *ngIf="showEditModal">
  <div class="modal-overlay" (click)="closeEditModal()"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit User</h3>
      <button class="btn-close" (click)="closeEditModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="editUser.username" disabled />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="editUser.email" placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="editUser.roles">
          <option value="ROLE_USER">User</option>
          <option value="ROLE_SUPERVISOR">Supervisor</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeEditModal()">Cancel</button>
      <button class="btn-save" (click)="updateUser()">Update User</button>
    </div>
  </div>
</div>
