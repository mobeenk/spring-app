<div class="reset-password-container">
  <div class="reset-password-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter the reset code sent to your email and create a new password</p>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="resetCode">Reset Code</label>
        <input
          type="text"
          id="resetCode"
          [(ngModel)]="resetCode"
          name="resetCode"
          placeholder="Enter 6-digit code"
          [disabled]="isLoading"
          maxlength="6"
          required
        />
        <small class="help-text">Check your email for the reset code (valid for 15 minutes)</small>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="newPassword"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            [disabled]="isLoading"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()"
            tabindex="-1">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-input">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            [disabled]="isLoading"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="toggleConfirmPasswordVisibility()"
            tabindex="-1">
            {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="links">
      <a routerLink="/login">Back to Login</a>
      <span>•</span>
      <a routerLink="/forgot-password">Resend Code</a>
    </div>
  </div>
</div>
